# TEMPORARY — issue #1781, Task 1. Surveys what confinement mechanisms an unprivileged process can
# actually use on `ubuntu-latest`, so ADR 0012's "Linux gets network only, and often not even that"
# consequence can be retired against evidence rather than assumption. Deleted in the same PR once the
# findings are recorded.
name: Linux userns survey (temporary, #1781)

on:
  push:
    branches: ['feat/1781-**']

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - name: unshare --user --net, without --map-root-user
        run: |
          set +e
          echo "## unshare --user --net /usr/bin/true (no uid map)"
          unshare --user --net /usr/bin/true; echo "exit=$?"
          cat > /tmp/net.sh <<'EOF'
          #!/bin/bash
          if (exec 3<>/dev/tcp/127.0.0.1/$1) 2>/dev/null; then echo network=allowed; else echo network=denied; fi
          EOF
          chmod +x /tmp/net.sh
          python3 -c "
          import socket,subprocess,os
          s=socket.socket(); s.bind(('127.0.0.1',0)); s.listen(1)
          p=s.getsockname()[1]
          print('## control'); subprocess.run(['/tmp/net.sh',str(p)])
          print('## under unshare --user --net')
          r=subprocess.run(['unshare','--user','--net','/tmp/net.sh',str(p)]); print('exit=',r.returncode)
          "

      - name: Landlock — /dev/null rule, and ABI>=4 network bits
        run: |
          set +e
          cat > /tmp/ll.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <string.h>
          #include <errno.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <stdlib.h>
          #include <sys/syscall.h>
          #include <sys/prctl.h>
          #include <linux/types.h>
          #define NR_CREATE 444
          #define NR_ADD 445
          #define NR_RESTRICT 446
          struct attr { __u64 fs; __u64 net; };
          struct beneath { __u64 allowed; __s32 fd; } __attribute__((packed));
          struct netport { __u64 allowed; __u64 port; };
          #define FS_ALL 0x3fffULL          /* bits 0..13, EXECUTE..REFER */
          #define FS_TRUNC (1ULL<<14)
          #define FS_RO ((1ULL<<0)|(1ULL<<2)|(1ULL<<3))
          #define NET_BIND (1ULL<<0)
          #define NET_CONNECT (1ULL<<1)
          int main(int argc, char **argv) {
            int abi = syscall(NR_CREATE, NULL, 0, 1U);
            fprintf(stderr, "abi=%d\n", abi);
            unsigned long long fs = FS_ALL; if (abi >= 3) fs |= FS_TRUNC;
            struct attr a = { .fs = fs, .net = abi >= 4 ? (NET_BIND|NET_CONNECT) : 0 };
            size_t sz = abi >= 4 ? sizeof(a) : sizeof(__u64);
            int rs = syscall(NR_CREATE, &a, sz, 0);
            if (rs < 0) { fprintf(stderr, "create: %s\n", strerror(errno)); return 1; }
            int root = open("/", O_PATH|O_CLOEXEC);
            struct beneath r = { .allowed = FS_RO, .fd = root };
            if (syscall(NR_ADD, rs, 1, &r, 0) < 0) { fprintf(stderr,"add /: %s\n",strerror(errno)); return 1; }
            int run = open(argv[1], O_PATH|O_CLOEXEC);
            struct beneath r2 = { .allowed = fs, .fd = run };
            if (syscall(NR_ADD, rs, 1, &r2, 0) < 0) { fprintf(stderr,"add run: %s\n",strerror(errno)); return 1; }
            const char *devs[] = {"/dev/null","/dev/zero","/dev/random","/dev/urandom",0};
            for (int i = 0; devs[i]; i++) {
              int fd = open(devs[i], O_PATH|O_CLOEXEC);
              if (fd < 0) { fprintf(stderr,"open %s: %s\n",devs[i],strerror(errno)); continue; }
              struct beneath d = { .allowed = (1ULL<<1)|(1ULL<<2), .fd = fd };
              if (syscall(NR_ADD, rs, 1, &d, 0) < 0) fprintf(stderr,"add %s: %s\n",devs[i],strerror(errno));
              close(fd);
            }
            if (prctl(PR_SET_NO_NEW_PRIVS,1,0,0,0)) { fprintf(stderr,"nnp: %s\n",strerror(errno)); return 1; }
            if (syscall(NR_RESTRICT, rs, 0)) { fprintf(stderr,"restrict: %s\n",strerror(errno)); return 1; }
            fprintf(stderr, "restricted\n");
            execv(argv[2], &argv[2]);
            fprintf(stderr, "execv %s: %s\n", argv[2], strerror(errno));
            return 127;
          }
          EOF
          gcc -O0 -o /tmp/ll /tmp/ll.c; echo "gcc=$?"
          mkdir -p /tmp/run
          cat > /tmp/probe.sh <<'EOF'
          #!/bin/sh
          inside=denied; outside=denied
          if : > /tmp/run/inside.txt 2>/dev/null; then inside=allowed; fi
          if : > /tmp/outside.txt 2>/dev/null; then outside=allowed; fi
          echo "inside=${inside} outside=${outside} devnull=$( (echo x > /dev/null) 2>/dev/null && echo ok || echo denied )"
          EOF
          chmod +x /tmp/probe.sh
          echo "## control"; /tmp/probe.sh; rm -f /tmp/outside.txt /tmp/run/inside.txt
          echo "## under Landlock with /dev/* rules"; /tmp/ll /tmp/run /tmp/probe.sh; echo "exit=$?"
          echo "## .NET under the same ruleset"; /tmp/ll /tmp/run "$(which dotnet)" --info > /dev/null; echo "exit=$?"
          echo "## network under Landlock ABI>=4 net bits"
          python3 -c "
          import socket,subprocess
          s=socket.socket(); s.bind(('127.0.0.1',0)); s.listen(1); p=s.getsockname()[1]
          cat = open('/tmp/n.sh','w'); cat.write('#!/bin/bash\nif (exec 3<>/dev/tcp/127.0.0.1/'+str(p)+') 2>/dev/null; then echo network=allowed; else echo network=denied; fi\n'); cat.close()
          import os; os.chmod('/tmp/n.sh',0o755)
          print('control:'); subprocess.run(['/tmp/n.sh'])
          print('landlocked:'); subprocess.run(['/tmp/ll','/tmp/run','/tmp/n.sh'])
          "
