name: Koine Studio

# Cross-platform CI for the Koine IDE stack: publishes the `koine lsp` sidecar,
# runs the headless LSP JSON-RPC tests, and builds Koine Studio (the Tauri v2
# desktop app) on Linux, Windows, and macOS. Mirrors the action versions and
# .NET setup used by ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    # Explicit so `ready_for_review` can be added below — the default types omit it, and the
    # draft gates on studio-desktop/studio-web need it to re-evaluate when a draft PR flips to
    # ready (issue #1481). opened/synchronize/reopened are the defaults, kept explicit here.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs (each run spans 3 OS legs); never cancel a push to main.
#
# Scope/limitation (issue #1665): this only cancels a run that is still IN PROGRESS when a newer one
# for the same PR starts. It does not help when an earlier trigger (e.g. `synchronize`, evaluated while
# the PR is still draft) already completes — the draft-gate below makes that near-instant — before a
# later trigger (e.g. `ready_for_review`) even starts: by then there is nothing "in progress" to cancel,
# so both runs show up for the same head SHA even though only the second one does real work. That's
# expected/unavoidable from this workflow's YAML (see the issue for the full incident analysis); it is
# NOT the same thing as two runs racing each other, which this block does prevent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Desktop build/test on all 3 OSes via the reusable workflow. bundle/publish stay false in CI:
  # this reproduces the prior inline `studio` job exactly (no installers produced or uploaded).
  studio-desktop:
    # Skip draft PRs — they're not ready for review/merge yet, so don't burn CI minutes on every push.
    # This gate only re-evaluates if the trigger's `types:` above includes `ready_for_review` —
    # dropping it would let a ready-flip merge with this job permanently SKIPPED (issue #1481).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/studio-build.yml
    with:
      bundle: false
      publish: false

  # Validate the BROWSER edition of the studio: the Koine.Wasm compiler bundle plus the web
  # frontend (TypeScript typecheck + Vite bundle). Linux-only — the output is platform-neutral
  # static assets. This is the build the docs-site deploy folds into /Koine/studio/.
  studio-web:
    name: studio (web)
    # Skip draft PRs — they're not ready for review/merge yet, so don't burn CI minutes on every push.
    # This gate only re-evaluates if the trigger's `types:` above includes `ready_for_review` —
    # dropping it would let a ready-flip merge with this job permanently SKIPPED (issue #1481).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Backstop against a hung step (see the matrix job above); wasm workload install
    # plus the web bundle finish in a couple of minutes warm, well under this cap.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The browser compiler is a .NET WebAssembly module; building it needs the wasm
      # workloads. De-duplicated into the setup-dotnet-wasm composite (setup-dotnet ->
      # NuGet cache -> wasm cache -> install wasm workloads).
      - name: Setup .NET + wasm
        uses: ./.github/actions/setup-dotnet-wasm

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          # The repo root is the npm workspace root (tooling/*, website); the workspace's
          # single lockfile lives there, not per-member.
          cache-dependency-path: package-lock.json

      # npm workspaces keep a single lockfile at the repo root, so `npm ci` must run
      # there (it resolves `@atypical/koine-ui` via the workspace symlink, not the
      # registry). The build scripts below still run from the package subdirectory;
      # npm's ancestor node_modules walk finds the root-installed deps normally.
      #
      # Step-level backstop (issue #1665): a warm `npm ci` here normally finishes in well under a
      # minute, but on PR #1657 (2026-07-31) it hung for the entire job, only resolving when the
      # job's own 20-minute `timeout-minutes` above finally killed it. Bound this specific step so a
      # repeat fails in ~5 minutes instead of silently burning the whole job budget — root cause
      # (why `npm ci` itself stalled) is tracked separately, this is just the fast-fail backstop.
      #
      # Diagnostic capture (issue #1670): that hang produced zero output before being killed, giving no
      # way to tell how far `npm ci` even got — stuck immediately, or deep into package resolution.
      # `--loglevel http` prints one line per registry cache check/fetch as each completes (the default
      # `notice` level stays silent unless something fails), so a repeat hang's last printed line at
      # least narrows "got this far into dependency resolution, then nothing" versus never progressing
      # past setup. Locally this workspace's ~1170 packages turn a normal ~20s `npm ci` from ~30 log
      # lines into ~1000 — real but bounded added volume on every healthy run, accepted per the issue's
      # plan as the cost of the extra signal (`verbose`/`silly` would be an order of magnitude noisier
      # still, for no corresponding gain here).
      - name: Install npm dependencies (workspace root)
        timeout-minutes: 5
        run: npm ci --loglevel http

      # Lint gate (#978): the flat-config ESLint gate over both frontend packages mechanically enforces
      # the frontend safety conventions (void-prefixed promises, domById, escape-before-innerHTML, and
      # the react-hooks rules) that tsc can't see. Runs on this single Linux leg only — lint findings are
      # OS-independent, so triplicating it across the desktop matrix (whose `Build frontend (npm)` tsc
      # gate is unchanged) would add cost, not coverage. Right after `npm ci`, beside the tsc gates.
      - name: Lint frontend (npm)
        run: npm run lint -w koine-studio -w @atypical/koine-ui

      # ESLint config parity (#1924): `npm run lint` above proves each package is clean under ITS OWN
      # config — it cannot see that the two configs still AGREE. #998's load-bearing invariant is that a
      # shared rule is never half-enforced across the tree, and until this step that invariant was held
      # by a comment asking the next contributor to mirror their edit into the other package. This asks
      # ESLint what config it actually resolves for a representative file per config block, in both
      # packages, and fails on (a) any drift from the committed baseline, (b) the two packages
      # disagreeing on a shared rule, or (c) tooling/eslint-config's exports breaking their contract.
      # Runs beside the lint gate for the same reason: config resolution is OS-independent.
      - name: Check ESLint config parity (#1924)
        run: node scripts/ci/check-eslint-config-parity.mjs

      # Pack verification for the extracted @atypical/koine-ui package (issue #905): proves on every
      # PR that its published tarball contains the right files (dist/ only, no source/test files).
      # `npm pack` always runs the package's own `prepack` (`npm run build`) first, so this alone
      # proves both "builds cleanly" and "packs cleanly" — a separate `npm run build` here would just
      # rebuild the same unchanged output the root `postinstall` hook already built during `npm ci`
      # above. `--dry-run` never touches a registry — no publish, no credentials needed. Actual
      # publish-on-release is a separate follow-up (needs a release trigger/token decision).
      - name: Pack @atypical/koine-ui
        working-directory: tooling/koine-ui
        run: npm pack --dry-run

      # (a) Publish + bundle the in-browser compiler, then (b) typecheck and bundle the web frontend.
      # Built at the DEPLOY's sub-path base (/Koine/studio/) so the boot smoke-test below exercises the
      # exact base/worker-URL resolution users hit — without forcing AOT (the PR validation stays on the
      # fast interpreter; the #357 worker-boot bug is in the worker JS, independent of the wasm runtime).
      #
      # `build:wasm` shells out to `dotnet publish src/Koine.Wasm`, which triggers Koine.Compiler's
      # ANTLR grammar codegen (Antlr4BuildTasks launching a JVM). That launch intermittently fails with
      # `ANT02: Could not find or load main class org.antlr.v4.Tool` (issue #1044) — a transient
      # JVM-launch hiccup on the runner: a 100+-run audit found it exactly once, always cleared by a
      # bare re-run, with no shared-cache-corruption pattern. Retry only this invocation (not the whole
      # step/job), mirroring the Setup Rust retry-with-backoff in ci.yml (issue #524).
      - name: Build studio (web)
        working-directory: tooling/koine-studio
        env:
          KOINE_STUDIO_BASE: /Koine/studio/
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run build:wasm; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::npm run build:wasm failed after ${attempt} attempts (ANT02 JVM-launch flake — issue #1044)."
              exit 1
            fi
            echo "npm run build:wasm failed (attempt ${attempt}); retrying in $((attempt * 5))s…" >&2
            sleep "$((attempt * 5))"
          done
          npm run build:web

      # The compiler worker must actually boot in a real browser. The vitest/storybook suites MOCK the
      # worker, so without this a worker-boot regression (issue #357 — the studio showed "connection
      # failed") ships green. Only Chromium is needed; --with-deps installs its Linux system libs.
      - name: Install Playwright Chromium (boot smoke-test)
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: tooling/koine-studio
          cache-key-files: package-lock.json

      - name: Boot smoke-test — the real compiler boots in a browser (#357)
        working-directory: tooling/koine-studio
        env:
          KOINE_STUDIO_BASE: /Koine/studio/
        run: npm run test:browser

      # The registered service worker (#443/#517) is unit-tested against an in-memory FAKE Cache
      # Storage and the boot smoke-test above MOCKS the compiler worker — so nothing else here proves
      # the real SW actually intercepts _framework/* fetches, populates the real Cache Storage, and
      # serves the app + compiler with the network down (issue #521). Reuses the Chromium install
      # above — no second `setup-playwright` step needed.
      - name: Offline smoke-test — the service worker actually caches and serves offline (#521)
        working-directory: tooling/koine-studio
        env:
          KOINE_STUDIO_BASE: /Koine/studio/
        run: npm run test:offline
