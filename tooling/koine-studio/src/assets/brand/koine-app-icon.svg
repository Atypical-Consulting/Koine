<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Koine app icon">
  <!-- Bundle icon source for `tauri icon` (macOS .icns, Windows .ico, desktop PNGs).

       Identical artwork to koine-icon-tile.svg, inset to Apple's icon grid: the tile
       occupies 83.6% of the canvas with transparent margin around it, rather than
       bleeding to the edge. Measured 2026-08-03 against Calculator, Notes and Safari,
       all three of which fill exactly 83.6% x 83.6% of their canvas. A full-bleed tile
       renders visibly larger than every neighbouring icon in the Dock.

       Keep koine-icon-tile.svg full-bleed: it is the general-purpose brand tile for
       surfaces that supply their own container. This file exists only because the
       bundle icon has a platform convention that the brand tile should not be bent to. -->
  <g transform="translate(9.84, 9.84) scale(0.836)">
    <rect width="120" height="120" rx="28" fill="#5aa9ff"></rect>
    <svg x="20" y="20" width="80" height="80" viewBox="0 0 120 120" fill="none">
      <g stroke="#08111f" stroke-linejoin="round" stroke-linecap="round">
        <polygon points="106,60 83,99.84 37,99.84 14,60 37,20.16 83,20.16" stroke-width="6"></polygon>
        <g stroke-width="7.5">
          <path d="M48 36 V84"></path>
          <path d="M48 60 L78 36"></path>
          <path d="M48 60 L78 84"></path>
        </g>
      </g>
    </svg>
  </g>
</svg>
